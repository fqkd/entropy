name: Codex Macropad Windows
on:
  workflow_dispatch:
  push:
    branches: [codex/macropad-task-titles]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test local task source and transport
        run: |
          cargo test --bin entropy codex_macropad
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --bin entropy hid::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --bin entropy hid::hid_proxy::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cargo build --release --bin entropy
      - name: Collect build files
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/entropy.exe, Cargo.lock, CODEX_MACROPAD_RU.md dist/
          (Get-FileHash dist/entropy.exe -Algorithm SHA256).Hash | Set-Content dist/entropy.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: entropy-codex-windows
          path: dist/*
          if-no-files-found: error
